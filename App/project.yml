# Xcode project definition. Generate the project with:  cd App && xcodegen generate
name: AvaVision
options:
  bundleIdPrefix: com.avashmed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  AvaVisionKit:
    path: ..

targets:
  AvaVision:
    type: application
    platform: iOS
    sources:
      - path: AvaVision
        excludes:
          - "Models/**"
      # Folder reference: the model and its manifest are copied as-is so their hash stays stable.
      - path: AvaVision/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: AvaVisionKit
        product: AvaVisionCore
      - package: AvaVisionKit
        product: AvaVisionImaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avashmed.avavision
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: AvaVision
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_NSCameraUsageDescription: AvaVision uses the camera to photograph medication packs and pills so a pharmacist can check them and teach the app.
        # Exported training data appears in the Files app under On My iPhone › AvaVision.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

  AvaVisionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AvaVisionTests
    dependencies:
      - target: AvaVision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avashmed.avavision.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  AvaVision:
    build:
      targets:
        AvaVision: all
        AvaVisionTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - AvaVisionTests
